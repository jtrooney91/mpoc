group 'com.wizzitdigital.emv.flutter'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.wizzitdigital.emv.flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    buildFeatures {
        aidl = true
    }

    dependencies {
        // Local AAR files - use compileOnly so they're not bundled into the plugin AAR
        // The consuming app must include these AARs (same as native app)
        compileOnly files('libs/wizzitEmvSdk-1.7.3-release-protected_staging_eu_16072024.aar')
        compileOnly files('libs/wizzitEmvSdkMasterCard-2.1.0-release-protected_12072024 1.aar')
        compileOnly files('libs/wizzitEmvSdkVisa-1.0.6-release.aar')
        compileOnly files('libs/sonic-sdk-release-1.3.0.aar')
        compileOnly files('libs/VisaSensoryBranding.aar')
        // Note: dexguard-runtime.aar is NOT included (native app doesn't use it)

        // Kotlin
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

        // AndroidX
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        implementation 'androidx.security:security-crypto:1.1.0-alpha06'

        // HTTP Client
        implementation 'com.squareup.okhttp3:okhttp:4.11.0'

        // JSON
        implementation 'com.google.code.gson:gson:2.10.1'

        // Cryptography
        implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
        implementation 'org.conscrypt:conscrypt-android:2.5.2'

        // QR Code generation
        implementation 'com.google.zxing:core:3.5.2'
    }
}
