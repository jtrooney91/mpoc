name: wizzit_emv_flutter
description: A Flutter plugin for Wizzit EMV NFC card payment processing. Provides contactless payment capabilities, transaction management, and receipt delivery.
version: 1.0.0
homepage: https://wizzitdigital.com

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wizzitdigital.emv.flutter
        pluginClass: WizzitEmvFlutterPlugin
